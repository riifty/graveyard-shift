name: Build Graveyard Shift

on:
  push:
  workflow_dispatch:   # lets you press a "Run workflow" button

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Mac
            os: macos-latest
    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Mac)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Save the finished plugin
        uses: actions/upload-artifact@v4
        with:
          name: GRAVEYARD-SHIFT-BY-RIIFTY-${{ matrix.name }}
          path: build/GraveyardShift_artefacts
